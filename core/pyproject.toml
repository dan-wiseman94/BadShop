[project]
name = "badshop"
version = "0.1.0"
description = "Deliberately bad, old-internet photoshops, art-directed by any LLM"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "pillow>=10.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.8,<5",  # 5.x dropped the Haar cascades used for cat faces
    "rembg[cpu]",
    "pydantic>=2.7,<3",
    "platformdirs>=4",
]

[project.scripts]
badshop = "badshop.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/badshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs downloaded ML models (rembg, YuNet); cached in core/.test-cache",
    "network: talks to real internet services",
]
addopts = "-m 'not network'"
# A test that leaves a file or socket open fails (unclosed handles surface as unraisable warnings).
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # ruff's classic defaults, whatever ruff version resolves
ignore = ["E741"]  # the verbatim-ported reference code and the plan's tests use `l` as a loop variable
