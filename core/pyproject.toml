[project]
name = "badshop"
version = "0.4.0"
description = "Deliberately bad, old-internet photoshops, art-directed by any LLM"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "pillow>=13.0,<14",  # fixes decoder memory-safety/resource advisories in 12.3
    "filelock>=4.2.9,<5",  # security floor for transitive model-cache locking
    "numpy>=2.5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Intel macOS wheels stop at these inference runtimes; numba requires NumPy <2.4.
    "numpy>=2.3,<2.4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba==0.62.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-python-headless>=4.14,<5",  # 5.x dropped the Haar cascades used for cat faces
    "rembg[cpu]>=2.0.85",  # manifest.asset_path relies on BaseSession.model_dir() and models/<name>
    "pydantic>=2.7,<3",
    "platformdirs>=4",
    "psutil>=6",
    "websockets>=15,<17",
    "httpx>=0.28,<1",
    "litellm>=1.106.6,<2",  # streaming and function-only MCP bypass tested against this API
    "keyring>=25,<26",
    "mcp>=2.3,<3",
]

[project.scripts]
badshop = "badshop.cli.main:main"
badshop-core = "badshop.server.main:main"

[dependency-groups]
build = [
    "pyinstaller>=6,<7",
]
# jsonschema is used to validate the registry's generated schemas.
dev = ["pytest>=8", "pytest-xdist>=3,<4", "ruff>=0.6", "jsonschema>=4", "hypothesis>=6,<7"]
mutation = ["mutmut>=3.8,<4; sys_platform != 'win32'"]
quality = [
    "import-linter>=2.16",
    "lizard>=1.25.1",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/badshop"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "pyproject.toml", "uv.lock", "LICENSE"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: isolated module and engine-component checks (see tests/conftest.py)",
    "integration: process, transport, persistence, reference/golden, model or service checks",
    "models: needs downloaded models or fonts (rembg, YuNet, Anton, Comic Neue); cached in core/.test-cache",
    "network: talks to real internet services",
    "live: explicitly opted-in real provider smoke tests",
]
addopts = "-m 'not network'"
# A test that leaves a file or socket open fails (unclosed handles surface as unraisable warnings).
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TID251"]  # ruff's classic defaults, whatever ruff version resolves
ignore = ["E741"]  # the verbatim-ported reference code and the plan's tests use `l` as a loop variable

# Session owns app execution. The standalone parity CLI intentionally uses FileStore.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"badshop.tools.runner.execute" = { msg = "Execute application tools through session/." }
"badshop.tools.runner.run_tool" = { msg = "Execute application tools through session/." }

[tool.ruff.lint.per-file-ignores]
# Engine/registry tests intentionally exercise the runner without a session.
"**/tests/*.py" = ["TID251"]
"**/src/badshop/session/*.py" = ["TID251"]
"**/src/badshop/cli/main.py" = ["TID251"]

[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/badshop/archives.py", "src/badshop/server/rpc.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_fuzz_rpc.py",
    "tests/test_fuzz_projects.py::test_zip_preflight_enforces_all_three_limits",
    "tests/test_server_app.py::test_dispatcher_results",
    "tests/test_server_app.py::test_dispatcher_errors",
    "tests/test_project_boundaries.py::test_archive_size_limit_includes_ignored_members",
    "tests/test_project_boundaries.py::test_zip_directory_is_bounded_before_zipfile_allocates_it",
    "tests/test_server_app.py::test_dispatcher_rejects_nonfinite_params_before_calling_the_handler",
    "tests/test_server_app.py::test_failed_notification_is_silent_and_logs_the_method",
    "tests/test_server_app.py::test_methods_are_the_protocol",
    "tests/test_server_app.py::test_notification_frame",
]
