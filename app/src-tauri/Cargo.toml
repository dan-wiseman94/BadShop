[package]
name = "badshop-desktop"
version = "0.4.1"
description = "Badshop — a cockpit for deliberately bad photoshops"
authors = ["Dan Wiseman"]
license = "MIT"
edition = "2021"

[lib]
name = "badshop_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[dev-dependencies]
tempfile = "3"
