[package]
name = "badshop-desktop"
version = "0.1.0"
description = "Badshop — a cockpit for deliberately bad photoshops"
authors = ["Dan Wiseman"]
license = "MIT"
edition = "2021"

[lib]
name = "badshop_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
