name: installed desktop
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing release tag to rebuild (refs/tags/vX.Y.Z)
        required: true
        type: string
      candidate_tag:
        description: Verify downloaded candidate bytes instead of rebuilding
        type: string
        default: ''
  workflow_call:
    inputs:
      nightly:
        description: Build versioned nightly packages with signed updates
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  bundle:
    if: inputs.candidate_tag == '' || inputs.candidate_tag == null
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
            executable: badshop-core
            label: linux-x64
          - os: windows-latest
            bundles: nsis
            executable: badshop-core.exe
            label: windows-x64
          - os: macos-15
            bundles: app,dmg
            executable: badshop-core
            label: macos-arm64
          - os: macos-15-intel
            bundles: app,dmg
            executable: badshop-core
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Verify application version agreement
        run: uv run --no-project --python 3.12 python packaging/check_version.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 flatpak-builder libtbb12 xvfb xdotool xclip imagemagick gnome-keyring dbus-x11
      - name: Intel Mac cryptography build dependencies
        if: matrix.label == 'macos-x64'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> "$GITHUB_ENV"
      - run: uv sync --project core --locked --group build
      - name: CLI discovery and launch from desktop paths
        run: >-
          uv run --project core --locked pytest -q
          core/tests/test_cli_discovery.py
          core/tests/test_cli_provider.py::test_desktop_path_launches_discovered_cli
          core/tests/test_cli_provider.py::test_cli_scoped_configs_preserve_auth
      - name: Intel Mac image engine
        if: matrix.label == 'macos-x64'
        run: uv run --project core pytest core/tests/test_cutout_paste.py core/tests/test_manifest.py core/tests/test_text.py core/tests/test_macos_images.py -q
      - if: runner.os == 'Windows'
        run: uv run --project core pytest core/tests/test_cli_provider.py::test_windows_job_kills_descendants_after_cli_parent_exits core/tests/test_worker.py::test_a_real_tool_gives_the_same_outcome_as_in_process core/tests/test_server_ws.py::test_the_core_stops_cleanly_when_its_stdin_closes -q
      - run: uv run --project core --group build python packaging/build_core.py
      - name: Frozen core and real keychain (Linux)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -e -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            uv run --project core python packaging/smoke_core.py packaging/core-dist/badshop-core/badshop-core --keychain --metrics artifacts/verification/resources/core-runtime.json
          '
      - name: Frozen core and real keychain (Windows/macOS)
        if: runner.os != 'Linux'
        run: uv run --project core python packaging/smoke_core.py packaging/core-dist/badshop-core/${{ matrix.executable }} --keychain --metrics artifacts/verification/resources/core-runtime.json
        env:
          BADSHOP_SMOKE_TRACE: '0'
      - name: Frozen Intel Mac background removal
        if: matrix.label == 'macos-x64'
        run: uv run --project core python packaging/smoke_core.py packaging/core-dist/badshop-core/badshop-core --background-removal
      - run: pnpm --dir app install --frozen-lockfile
      - name: Bundle dependency inventory and license notices
        run: uv run --project core --locked --group build python packaging/release_inventory.py --label ${{ matrix.label }}
      - name: Configure signed release updates
        if: inputs.nightly || startsWith(inputs.source_ref || github.ref, 'refs/tags/v')
        shell: python
        env:
          BADSHOP_UPDATER_PUBLIC_KEY: ${{ vars.BADSHOP_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'packaging')
          for key in ('BADSHOP_UPDATER_PUBLIC_KEY', 'TAURI_SIGNING_PRIVATE_KEY'):
              if not os.environ.get(key, '').strip():
                  raise SystemExit(f'Release updates require {key}')
          config = Path('app/src-tauri/tauri.conf.json')
          value = json.loads(config.read_text())
          if os.environ['NIGHTLY'] == 'true':
              from update_manifest import nightly_version
              value['version'] = nightly_version(value['version'], os.environ['GITHUB_RUN_ID'])
          elif os.environ['SOURCE_REF'] != f"refs/tags/v{value['version']}":
              raise SystemExit('Release tag must match the application version')
          value['bundle']['createUpdaterArtifacts'] = True
          value['plugins']['updater']['pubkey'] = os.environ['BADSHOP_UPDATER_PUBLIC_KEY'].strip()
          config.write_text(json.dumps(value, indent=2))
      - name: Build native installers
        id: desktop-build
        run: pnpm --dir app exec tauri build --verbose --bundles ${{ matrix.bundles }} > packaging/native-build.log 2>&1
        env:
          BADSHOP_UPDATER_PUBLIC_KEY: ${{ vars.BADSHOP_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Give Mac updater archives distinct architecture names
        if: runner.os == 'macOS' && (inputs.nightly || startsWith(inputs.source_ref || github.ref, 'refs/tags/v'))
        shell: python
        env:
          UPDATE_LABEL: ${{ matrix.label }}
        run: |
          import os
          from pathlib import Path
          archives = list(Path('app/src-tauri/target/release/bundle').rglob('*.app.tar.gz'))
          if len(archives) != 1:
              raise SystemExit(f'Expected one Mac updater archive, found {len(archives)}')
          for path in archives:
              name = f"badshop-{os.environ['UPDATE_LABEL']}.app.tar.gz"
              Path(str(path) + '.sig').rename(path.with_name(name + '.sig'))
              path.rename(path.with_name(name))
      - name: Native build diagnostics
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: python -c "from pathlib import Path; p = Path('packaging/native-build.log'); print(p.read_text(encoding='utf-8', errors='replace')[-40000:] if p.exists() else 'Native build was not reached')"
      - name: Installed desktop window, renderer, normal exit (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1600x1100x24" uv run --project core python packaging/smoke_installer.py --screenshot packaging/native-smoke.png
      - name: Installed Windows editing, native Save and Open, normal exit
        if: runner.os == 'Windows'
        run: uv run --project core --with playwright==1.58.0 --with pywinauto==0.6.9 python packaging/smoke_installer.py --screenshot artifacts/verification/installed-windows/native-smoke.png
        env:
          PYTHONIOENCODING: utf-8
          BADSHOP_SMOKE_WEBVIEW_POLICY: '1'
      - name: Installed desktop window, renderer, normal exit (macOS)
        if: runner.os == 'macOS'
        run: uv run --project core --with pyobjc-framework-Cocoa --with pyobjc-framework-Quartz python packaging/smoke_installer.py --screenshot packaging/native-smoke.png
      - name: AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a --server-args="-screen 0 1600x1100x24" uv run --project core python packaging/smoke_desktop.py --restart-core --screenshot packaging/appimage-smoke.png -- app/src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract-and-run
      - name: Flatpak bundle and runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Jammy's original builder expects appstream-compose, absent from SDK 49.
          # Upgrade only after the native bundles have been built and tested.
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream-compose
          flatpak-builder --version
          dbus-run-session -- bash -e -c '
            flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
            flatpak install --user -y flathub org.gnome.Platform//49 org.gnome.Sdk//49
            uv run --project core python packaging/build_flatpak.py app/src-tauri/target/release/bundle/deb/*.deb
            flatpak install --user -y packaging/badshop.flatpak
            xvfb-run -a --server-args="-screen 0 1600x1100x24" uv run --project core python packaging/smoke_desktop.py --screenshot packaging/flatpak-smoke.png -- flatpak run io.github.danwiseman94.badshop
          '
      - name: Installer and frontend sizes
        shell: bash
        run: |
          uv run --project core --locked python scripts/resource_report.py packages --output artifacts/verification/resources/packages.json >> "$GITHUB_STEP_SUMMARY"
          uv run --project core --locked python scripts/resource_report.py frontend --output artifacts/verification/resources/frontend.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: desktop-evidence-${{ matrix.label }}
          path: |
            packaging/*smoke.png
            packaging/*smoke.ready.json
            packaging/*smoke.log
            packaging/*smoke.metrics.json
            artifacts/verification/resources/
            artifacts/verification/installed-windows/
          if-no-files-found: warn
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: desktop-failure-${{ matrix.label }}
          path: |
            packaging/native-build.log
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: badshop-${{ matrix.label }}
          path: |
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.dmg
            packaging/*.flatpak
            packaging/*.sbom.json
            packaging/*.licenses.json
            app/src-tauri/target/release/bundle/**/*.app.tar.gz
            app/src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error
  candidate:
    if: inputs.candidate_tag != '' && inputs.candidate_tag != null
    permissions:
      # GitHub exposes private drafts only to a token with release write access.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libfuse2 libtbb12 xvfb xdotool xclip imagemagick gnome-keyring dbus-x11 flatpak
      - run: uv sync --project core --locked
      - name: Download and inspect exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_LABEL: ${{ matrix.label }}
          BADSHOP_SMOKE_WEBVIEW_POLICY: '1'
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            dbus-run-session -- bash -e -c '
              printf "\n" | gnome-keyring-daemon --unlock --components=secrets
              xvfb-run -a --server-args="-screen 0 1600x1100x24" uv run --project core python packaging/accept_candidate.py
            '
          elif [[ "$RUNNER_OS" == macOS ]]; then
            uv run --project core --with pyobjc-framework-Cocoa --with pyobjc-framework-Quartz python packaging/accept_candidate.py
          else
            uv run --project core --with playwright==1.58.0 --with pywinauto==0.6.9 python packaging/accept_candidate.py
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: candidate-acceptance-${{ matrix.label }}
          path: artifacts/verification/candidate-acceptance/
          if-no-files-found: error
