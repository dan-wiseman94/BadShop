name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  core:
    uses: ./.github/workflows/core.yml
    with:
      full: true
  frontend:
    uses: ./.github/workflows/frontend-checks.yml
  bundle:
    uses: ./.github/workflows/native-desktop.yml
    secrets: inherit
  publish-installers:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, frontend, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: badshop-*
      - name: Generate signed update feed
        run: python packaging/update_manifest.py artifacts "$RELEASE_TAG" "$GITHUB_REPOSITORY"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, frontend, bundle]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build core --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
