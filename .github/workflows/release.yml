name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require source already merged to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  security:
    needs: source
    uses: ./.github/workflows/security.yml
  core:
    needs: source
    uses: ./.github/workflows/core.yml
    with:
      full: true
  frontend:
    needs: source
    uses: ./.github/workflows/frontend-checks.yml
  bundle:
    needs: source
    uses: ./.github/workflows/native-desktop.yml
    secrets: inherit
  stage-installers:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source, core, frontend, bundle, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          pattern: badshop-*
      - name: Generate signed update feed
        run: |
          python packaging/check_version.py "$RELEASE_TAG"
          python packaging/update_manifest.py artifacts "$RELEASE_TAG" "$GITHUB_REPOSITORY"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Record exact candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/release_gate.py stage artifacts "$RELEASE_TAG"
      - name: Hash release assets
        run: python packaging/release_checksums.py artifacts
      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/**/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
