name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security.yml
  core:
    uses: ./.github/workflows/core.yml
    with:
      full: true
  frontend:
    uses: ./.github/workflows/frontend-checks.yml
  bundle:
    uses: ./.github/workflows/native-desktop.yml
    secrets: inherit
  publish-installers:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, frontend, bundle, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
          pattern: badshop-*
      - name: Generate signed update feed
        run: |
          python packaging/check_version.py "$RELEASE_TAG"
          python packaging/update_manifest.py artifacts "$RELEASE_TAG" "$GITHUB_REPOSITORY"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Hash release assets
        run: python packaging/release_checksums.py artifacts
      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/**/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
  pypi:
    # Desktop-only releases are the current scope. Enable after PyPI publisher setup.
    if: startsWith(github.ref, 'refs/tags/v') && vars.BADSHOP_PYPI_PUBLISH == 'true'
    needs: [core, frontend, bundle, security, publish-installers]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build core --out-dir dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
