name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
            executable: badshop-core
            label: linux-x64
          - os: windows-latest
            bundles: nsis
            executable: badshop-core.exe
            label: windows-x64
          - os: macos-15
            bundles: dmg
            executable: badshop-core
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 flatpak-builder
      - run: uv sync --project core --locked --group build
      - run: uv run --project core --group build python packaging/build_core.py
      - run: uv run --project core python packaging/smoke_core.py packaging/core-dist/badshop-core/${{ matrix.executable }}
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app exec tauri build --bundles ${{ matrix.bundles }}
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//49 org.gnome.Sdk//49
          uv run --project core python packaging/build_flatpak.py app/src-tauri/target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v6
        with:
          name: badshop-${{ matrix.label }}
          path: |
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.dmg
            packaging/*.flatpak
          if-no-files-found: error
  publish-installers:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build core --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
