name: desktop
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  installed-desktop:
    uses: ./.github/workflows/native-desktop.yml
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: uv sync --project core --locked
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app test
      - run: pnpm --dir app exec playwright install --with-deps chromium
      - run: ./verify.sh browser
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-results
          path: artifacts/verification
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: mkdir -p app/dist packaging/core-dist && echo '<html></html>' > app/dist/index.html
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check
