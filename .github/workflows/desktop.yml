name: desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml
  frontend:
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-checks.yml
  native:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri
      - run: mkdir -p app/dist packaging/core-dist && echo '<html></html>' > app/dist/index.html
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check
  desktop-result:
    if: always()
    needs: [scope, frontend, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          assert results["scope"]["result"] == "success", "Change classification failed"
          failed = {name: job["result"] for name, job in results.items() if job["result"] not in ("success", "skipped")}
          assert not failed, failed
          for flag, job in {'frontend': 'frontend', 'native': 'native'}.items():
              if results["scope"]["outputs"][flag] == "true":
                  assert results[job]["result"] == "success", f"Selected job {job} did not pass"
          print("All selected checks passed; unselected jobs were intentionally skipped.")
          PY
