name: desktop
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frozen-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            executable: badshop-core
          - os: windows-latest
            executable: badshop-core.exe
          - os: macos-15
            executable: badshop-core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --project core --locked --group build
      - if: runner.os == 'Windows'
        run: uv run --project core pytest core/tests/test_cli_provider.py::test_windows_job_kills_descendants_after_cli_parent_exits core/tests/test_worker.py::test_a_real_tool_gives_the_same_outcome_as_in_process -q
      - run: uv run --project core --group build python packaging/build_core.py
      - run: uv run --project core python packaging/smoke_core.py packaging/core-dist/badshop-core/${{ matrix.executable }}
        env:
          BADSHOP_SMOKE_TRACE: '0'
      - name: Prepare Windows native startup diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $debugger = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $debugger)) {
            $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2382321' -OutFile $installer
            $setup = Start-Process $installer -ArgumentList '/features OptionId.WindowsDesktopDebuggers /quiet /norestart' -Wait -PassThru
            if ($setup.ExitCode -notin @(0, 3010)) { throw "Debugger installation failed: $($setup.ExitCode)" }
          }
          if (-not (Test-Path $debugger)) { throw 'CDB was not installed' }
          "BADSHOP_CDB=$debugger" >> $env:GITHUB_ENV
      - name: Diagnose failed Windows worker startup
        if: failure() && runner.os == 'Windows'
        run: uv run --project core python packaging/smoke_core.py packaging/core-dist/badshop-core/badshop-core.exe
        env:
          BADSHOP_SMOKE_TRACE: '1'
      - uses: actions/upload-artifact@v6
        if: failure() && runner.os == 'Windows'
        with:
          name: windows-frozen-core-failure
          path: packaging/core-dist/badshop-core
          retention-days: 3
          compression-level: 0
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: uv sync --project core --locked
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app test
      - run: pnpm --dir app build
      - run: pnpm --dir app exec playwright install --with-deps chromium
      - run: pnpm --dir app exec playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-test-results
          path: app/test-results
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: mkdir -p app/dist packaging/core-dist && echo '<html></html>' > app/dist/index.html
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check
