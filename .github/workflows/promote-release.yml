name: promote release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft candidate tag with acceptance committed on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # Serialize stable/latest and nightly-feed promotion, including approval waits.
  group: release-promotion
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'dan-wiseman94/BadShop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
      attestations: read
    outputs:
      source: ${{ steps.accept.outputs.source }}
      track: ${{ steps.accept.outputs.track }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate candidate tag before downloading
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'packaging')
          from release_gate import track
          track(os.environ['RELEASE_TAG'])
          PY
      - name: Download the complete draft
        run: gh release download "$RELEASE_TAG" --dir artifacts
      - name: Validate evidence, source checks, provenance and current bytes before publication
        id: accept
        run: python packaging/release_gate.py publish artifacts "$RELEASE_TAG"
      - name: Refuse to move the nightly feed backwards
        id: promote
        if: steps.accept.outputs.track == 'nightly'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, re, sys
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          sys.path.insert(0, 'packaging')
          from update_manifest import can_promote_nightly
          candidate = json.loads(Path('artifacts/latest.json').read_text())
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/nightly"
          request = Request(url, headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'})
          try:
              with urlopen(request, timeout=30) as response:
                  release = json.load(response)
              version = re.search(r'^Nightly version: (\S+)$', release.get('body') or '', re.MULTILINE)
              if not version:
                  raise ValueError('Existing nightly release has no version marker; refusing to replace it')
              missing = not any(asset['name'] == 'latest.json' for asset in release['assets'])
              promote = can_promote_nightly({'version': version[1]}, candidate, feed_missing=missing)
          except HTTPError as error:
              if error.code != 404:
                  raise
              promote = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'promote={str(promote).lower()}\n')
              output.write(f"version={candidate['version']}\n")
      - name: Promote the signed feed after immutable downloads are public
        if: steps.accept.outputs.track == 'nightly' && steps.promote.outputs.promote == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nightly
          target_commitish: ${{ steps.accept.outputs.source }}
          name: Nightly update feed
          # The action saves this marker before replacing the asset, preserving the
          # high-water mark even if upload fails after deleting the previous file.
          body: |
            Mutable update feed. Download installers from the dated nightly prereleases.
            Nightly version: ${{ steps.promote.outputs.version }}
          files: artifacts/latest.json
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: 'false'
      - name: Retain promotion evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-acceptance
          path: |
            packaging/release-acceptance/
            artifacts/SHA256SUMS
            artifacts/release-candidate.json
            artifacts/*.licenses.json
  pypi:
    if: needs.publish.outputs.track == 'stable' && vars.BADSHOP_PYPI_PUBLISH == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish.outputs.source }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build core --out-dir dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
