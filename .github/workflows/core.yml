name: core
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a cold run (dependencies, models, fonts) takes a few minutes; a hang never ends
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no floating major tags since v8
      - uses: actions/cache@v6
        with:
          path: core/.test-cache
          key: test-cache-${{ hashFiles('core/uv.lock') }}
      - run: uv sync --locked  # fail if uv.lock is stale rather than resolve afresh
      - run: uv run ruff check .
      - run: uv run pytest -q
